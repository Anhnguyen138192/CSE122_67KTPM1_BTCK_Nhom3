<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đánh Giá & Phản Hồi Chuyến Đi – CommuteMatch</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="app-header"></div>

  <div class="app-shell">
    <div id="app-sidebar"></div>

    <main class="app-main">
      <div class="page-header">
        <div>
          <div class="breadcrumbs">
            <a href="rider-my-trips.html">Chuyến đi</a> / <span>Đánh giá</span>
          </div>
          <h1 class="page-title">⭐ Đánh Giá & Góp Ý Chuyến Đi</h1>
        </div>
      </div>

      <div class="card" style="max-width: 680px; margin: 0 auto; box-shadow: var(--shadow-md);">
        <div class="card-body" style="padding: 2rem;">
          <div class="text-center mb-4">
            <div class="avatar" id="revAvatar" style="width: 64px; height: 64px; font-size: 1.6rem; margin: 0 auto 0.75rem; background-color: #0d9488; color: white;">
              MQ
            </div>
            <h3 style="font-size: 1.25rem; margin-bottom: 0.2rem;" id="revDriverName">Trần Minh Quân</h3>
            <p style="font-size: 0.88rem; color: var(--text-muted);">
              Chuyến đi: <strong>KTX Khu B → ĐH Bách Khoa CS2</strong>
            </p>
          </div>

          <form id="reviewForm" onsubmit="submitReview(event)">
            <!-- Star Rating Interactive Selector -->
            <div class="form-group text-center mb-4">
              <label class="form-label" style="font-size: 1rem; margin-bottom: 0.5rem;">Trải nghiệm của bạn thế nào?</label>
              <div id="starContainer" style="font-size: 2.5rem; cursor: pointer; color: #cbd5e1; display: inline-flex; gap: 0.5rem;">
                <span onclick="setStars(1)">★</span>
                <span onclick="setStars(2)">★</span>
                <span onclick="setStars(3)">★</span>
                <span onclick="setStars(4)">★</span>
                <span onclick="setStars(5)">★</span>
              </div>
              <div id="starLabel" style="font-size: 0.9rem; font-weight: 700; color: var(--primary); margin-top: 0.25rem;">
                Tuyệt vời (5 / 5 sao)
              </div>
            </div>

            <!-- Compliment Tags -->
            <div class="form-group mb-4">
              <label class="form-label">Chọn điểm nổi bật của bạn đồng hành:</label>
              <div class="d-flex flex-wrap gap-2" id="tagList">
                <button type="button" class="btn btn-outline btn-sm active-tag" onclick="toggleTag(this)">⏱️ Đúng giờ từng phút</button>
                <button type="button" class="btn btn-outline btn-sm active-tag" onclick="toggleTag(this)">🛡️ Lái xe cẩn thận, an toàn</button>
                <button type="button" class="btn btn-outline btn-sm active-tag" onclick="toggleTag(this)">🪖 Mũ bảo hiểm sạch sẽ</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="toggleTag(this)">😊 Thân thiện, hòa đồng</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="toggleTag(this)">📍 Đón đúng trạm quy ước</button>
              </div>
            </div>

            <!-- Comment Box -->
            <div class="form-group mb-4">
              <label class="form-label" for="reviewComment">Nhận xét chi tiết (được hiển thị ẩn danh trên hồ sơ):</label>
              <textarea id="reviewComment" class="form-control" rows="3" placeholder="Chia sẻ cảm nhận của bạn để giúp cộng đồng sinh viên chọn bạn đồng hành tin cậy..."></textarea>
            </div>

            <div class="d-flex justify-between items-center">
              <a href="rider-my-trips.html" class="btn btn-outline">Bỏ qua lúc này</a>
              <button type="submit" class="btn btn-primary btn-lg">
                Gửi Đánh Giá & Hoàn Tất
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <div id="app-footer"></div>

  <style>
    .active-tag {
      background-color: var(--primary-light) !important;
      border-color: var(--primary) !important;
      color: var(--primary) !important;
      font-weight: 600;
    }
  </style>

  <script src="../js/data/mock-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/modules/toast.js"></script>
  <script src="../js/modules/modal.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/ai-engine.js"></script>
  <script src="../js/main.js"></script>

  <script>
    let currentStars = 5;

    document.addEventListener("DOMContentLoaded", () => {
      setStars(5);
    });

    function setStars(val) {
      currentStars = val;
      const spans = document.querySelectorAll("#starContainer span");
      const labels = [
        "", "Cần cải thiện (1 sao)", "Bình thường (2 sao)",
        "Tốt (3 sao)", "Rất tốt (4 sao)", "Tuyệt vời (5 sao)"
      ];

      spans.forEach((s, idx) => {
        s.style.color = idx < val ? "var(--warning)" : "#cbd5e1";
      });

      document.getElementById("starLabel").innerText = labels[val];
    }

    function toggleTag(btn) {
      btn.classList.toggle("active-tag");
    }

    function submitReview(e) {
      e.preventDefault();
      const user = window.Storage.getCurrentUser();
      const comment = document.getElementById("reviewComment").value.trim() || "Chuyến đi an toàn, tài xế đúng giờ và thân thiện.";

      const selectedTags = Array.from(document.querySelectorAll("#tagList .active-tag")).map(b => b.innerText);

      const newRating = {
        id: "rate_" + Date.now(),
        tripId: "trip_101",
        fromUserId: user.id,
        fromUserName: user.name,
        toUserId: "u_driver1",
        toUserName: "Trần Minh Quân",
        stars: currentStars,
        tags: selectedTags,
        comment: comment,
        date: new Date().toLocaleDateString("vi-VN")
      };

      window.Storage.insert("ratings", newRating);

      // Thưởng điểm uy tín Trust Score
      window.Storage.update("users", user.id, {
        trustScore: Math.min(100, (user.trustScore || 95) + 1),
        tripsCount: (user.tripsCount || 24) + 1
      });

      window.Toast.show("Cảm ơn bạn đã gửi đánh giá! Bạn được cộng +1 Điểm Uy Tín.", "success");

      setTimeout(() => {
        window.location.href = "rider-dashboard.html";
      }, 800);
    }
  </script>
</body>
</html>
