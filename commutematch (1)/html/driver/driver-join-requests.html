<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <title>Quản Lý Yêu Cầu Ghép Chuyến – CommuteMatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <a class="visually-hidden-focusable position-absolute top-0 start-0 p-2 bg-white" href="#main-content">Bỏ qua điều hướng</a>
  <div id="app-header"></div>

  <div class="app-shell">
    <div id="app-sidebar"></div>

    <main class="app-main" id="main-content">
      <div class="page-header">
        <div>
          <div class="breadcrumbs">
            <a href="driver/driver-dashboard.html">Tài xế</a> / <span>Yêu cầu ghép chuyến</span>
          </div>
          <h1 class="page-title"><i class="fa-solid fa-users" aria-hidden="true"></i> Phê Duyệt Yêu Cầu Ghép Chuyến</h1>
        </div>
      </div>

      <!-- Tabs Lọc Trạng Thái -->
      <div class="tabs-header">
        <button class="tab-btn active" data-cm-action="filter-requests" data-filter="pending">
          <i class="fa-solid fa-hourglass-half" aria-hidden="true"></i> Đang Chờ Duyệt (<span id="reqCountPending">0</span>)
        </button>
        <button class="tab-btn" data-cm-action="filter-requests" data-filter="accepted">
          <i class="fa-solid fa-check" aria-hidden="true"></i> Đã Phê Duyệt (<span id="reqCountAccepted">0</span>)
        </button>
        <button class="tab-btn" data-cm-action="filter-requests" data-filter="rejected">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i> Đã Từ Chối (<span id="reqCountRejected">0</span>)
        </button>
      </div>

      <!-- Danh sách thẻ yêu cầu -->
      <div id="requestsContainer" class="d-flex flex-column gap-3">
        <!-- Rendered dynamically -->
      </div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script src="../js/data/mock-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/modules/toast.js"></script>
  <script src="../js/modules/modal.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/ai-engine.js"></script>
  <script src="../js/main.js"></script>

  <script src="../js/modules/driver-trip-utils.js"></script>
  <script src="../js/modules/driver-api.js"></script>
  <script src="driver/js/driver-join-requests.js"></script>
  <script src="../js/modules/page-actions.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
