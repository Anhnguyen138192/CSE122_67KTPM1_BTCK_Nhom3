<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khôi Phục Mật Khẩu – CommuteMatch</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background-color: var(--bg-body);">
  <div id="app-header"></div>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
    <div class="card" style="max-width: 440px; width: 100%; box-shadow: var(--shadow-lg);">
      <div class="card-body" style="padding: 2rem;">
        <div class="text-center mb-3">
          <div style="font-size: 2.2rem; margin-bottom: 0.5rem;"><i class="fa-solid fa-key" aria-hidden="true"></i></div>
          <h2 style="font-size: 1.4rem;">Quên Mật Khẩu</h2>
          <p style="font-size: 0.88rem;">Nhập email đã đăng ký để nhận mã OTP xác minh đổi mật khẩu</p>
        </div>

        <div id="step1">
          <div class="form-group">
            <label class="form-label" for="resetEmail">Email <span class="required">*</span></label>
            <input type="email" id="resetEmail" class="form-control" placeholder="ban@example.com">
          </div>
          <button type="button" class="btn btn-primary btn-block btn-lg" onclick="sendOtp()">
            Gửi Mã OTP Xác Minh
          </button>
        </div>

        <div id="step2" style="display: none;">
          <div class="ai-panel mb-3" style="padding: 1rem;">
            <div style="font-size: 0.85rem; color: var(--success); font-weight: 600;">
              <i class="fa-solid fa-circle-check" aria-hidden="true"></i> Mã OTP 6 chữ số đã được gửi giả lập: <strong>888999</strong>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Nhập mã OTP</label>
            <input type="text" id="otpCode" class="form-control text-center" placeholder="••••••" maxlength="6" style="letter-spacing: 4px; font-weight: bold; font-size: 1.2rem;">
          </div>

          <div class="form-group">
            <label class="form-label">Mật khẩu mới</label>
            <input type="password" id="newPass" class="form-control" placeholder="Tối thiểu 6 ký tự">
          </div>

          <button type="button" class="btn btn-primary btn-block btn-lg" onclick="verifyAndReset()">
            Xác Nhận & Đổi Mật Khẩu
          </button>
        </div>

        <div class="text-center mt-3">
          <a href="common/login.html" style="font-size: 0.88rem;">← Quay lại trang Đăng nhập</a>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="../js/data/mock-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/modules/toast.js"></script>
  <script src="../js/modules/modal.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/ai-engine.js"></script>
  <script src="../js/main.js"></script>

  <script src="../js/pages/common/forgot-password.js"></script>
</body>
</html>
