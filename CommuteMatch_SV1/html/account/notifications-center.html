<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trung Tâm Thông Báo – CommuteMatch</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app-header"></div>

  <div class="app-shell">
    <div id="app-sidebar"></div>

    <main class="app-main">
      <div class="page-header">
        <div>
          <div class="breadcrumbs">
            <a href="index.html">Trang chủ</a> / <span>Thông báo</span>
          </div>
          <h1 class="page-title"><i class="fa-solid fa-bell" aria-hidden="true"></i> Trung Tâm Thông Báo</h1>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline btn-sm" onclick="markAllAsRead()"><i class="fa-solid fa-check" aria-hidden="true"></i> Đánh dấu đã đọc hết</button>
          <button class="btn btn-outline btn-sm text-danger" onclick="clearAllNotifs()"><i class="fa-solid fa-trash" aria-hidden="true"></i> Xóa tất cả</button>
        </div>
      </div>

      <!-- Tabs Lọc -->
      <div class="tabs-header">
        <button class="tab-btn active" onclick="filterTab('all', this)">Tất cả (<span id="countAll">0</span>)</button>
        <button class="tab-btn" onclick="filterTab('unread', this)">Chưa đọc (<span id="countUnread">0</span>)</button>
      </div>

      <div class="card">
        <div class="card-body" id="notifListContainer" style="padding: 0;">
          <!-- Render notifications -->
        </div>
      </div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script src="../js/data/mock-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/modules/toast.js"></script>
  <script src="../js/modules/modal.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/ai-engine.js"></script>
  <script src="../js/main.js"></script>

  <script src="../js/pages/account/notifications-center.js"></script>
</body>
</html>
