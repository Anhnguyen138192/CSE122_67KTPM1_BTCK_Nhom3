<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" crossorigin="anonymous">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duyệt Hồ Sơ Tài Xế – CommuteMatch</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div id="app-header"></div>
  <div class="app-shell">
    <div id="app-sidebar"></div>
    <main class="app-main">
      <div class="page-header">
        <div>
          <div class="breadcrumbs">
            <a href="coordinator-mobility-dashboard.html">Điều phối viên</a> / <span>Duyệt hồ sơ tài xế</span>
          </div>
          <h1 class="page-title"><i class='fas fa-edit fa-ui-icon' aria-hidden='true'></i> Duyệt hồ sơ ứng tuyển tài xế</h1>
          <p>Điều phối viên xem xét hồ sơ tài xế. Ô tô vẫn cần được kiểm định riêng trước khi phân công chuyến.</p>
        </div>
      </div>
      <section class="card">
        <div class="card-body">
          <div id="driverApplicationList"></div>
        </div>
      </section>
    </main>
  </div>
  <div id="app-footer"></div>

  <script src="../../assets/data/mock-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/modules/toast.js"></script>
  <script src="../../js/modules/modal.js"></script>
  <script src="../../js/modules/auth.js"></script>
  <script src="../../js/modules/ai-engine.js"></script>
  <script src="../../js/routes.js"></script>
  <script src="../../js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", renderDriverApplications);

    function renderDriverApplications() {
      const pending = window.Storage.get("roleApplications").filter((application) =>
        application.role === "driver" && application.status === "pending"
      );
      const host = document.getElementById("driverApplicationList");
      if (!pending.length) {
        host.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class='fas fa-edit fa-ui-icon' aria-hidden='true'></i></div><div class="empty-title">Không có hồ sơ tài xế chờ duyệt</div><div class="empty-desc">Đơn ứng tuyển tài xế mới sẽ xuất hiện tại đây.</div></div>';
        return;
      }

      host.innerHTML = pending.map((application) => {
        const applicant = window.Storage.getById("users", application.userId);
        const details = application.details || {};
        const fields = [
          ["Dòng ô tô", details.vehicleType],
          ["Hãng và mẫu xe", details.vehicleModel],
          ["Tổng số ghế (kể cả tài xế)", details.vehicleSeats],
          ["Biển số", details.vehiclePlate],
          ["Thông tin GPLX", details.driverLicense]
        ];
        const images = [
          ["Ảnh phương tiện", details.vehiclePhoto],
          ["Ảnh GPLX", details.driverLicensePhoto],
          ["Ảnh CCCD", details.citizenIdPhoto]
        ];
        return `
          <article class="card mb-3">
            <div class="card-body">
              <div class="d-flex justify-between items-center flex-wrap gap-2">
                <div>
                  <h2>${escapeHtml(applicant ? applicant.name : application.userName)}</h2>
                  <p class="text-muted">${escapeHtml(applicant ? applicant.id : application.userId)}${applicant && applicant.email ? ` · ${escapeHtml(applicant.email)}` : ""}</p>
                </div>
                <span class="badge badge-warning">Chờ duyệt</span>
              </div>
              <dl class="mt-2">
                ${fields.map(([label, value]) => `<div class="mb-1"><dt style="font-weight:700;">${label}</dt><dd>${escapeHtml(value || "—")}</dd></div>`).join("")}
              </dl>
              <div class="d-grid grid-cols-3 gap-2 mt-2">
                ${images.map(([label, image]) => renderImage(label, image)).join("")}
              </div>
              <div class="d-flex gap-2 mt-3">
                <button type="button" class="btn btn-primary" onclick="reviewDriverApplication('${escapeHtml(application.id)}', true)">Duyệt hồ sơ tài xế</button>
                <button type="button" class="btn btn-outline text-danger" onclick="reviewDriverApplication('${escapeHtml(application.id)}', false)">Từ chối</button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function reviewDriverApplication(id, approved) {
      const result = window.Auth.reviewRoleApplication(id, approved);
      window.Toast.show(result.message, result.success ? "success" : "error");
      if (result.success) renderDriverApplications();
    }

    function renderImage(label, image) {
      if (!image || !/^data:image\/jpeg;base64,/.test(image.dataUrl || "")) {
        return `<div><strong>${label}</strong><p class="text-muted">Chưa có ảnh</p></div>`;
      }
      return `<div><strong>${label}</strong><img src="${escapeHtml(image.dataUrl)}" alt="${label}" loading="lazy" style="display:block;width:100%;max-height:260px;object-fit:contain;margin-top:.4rem;border:1px solid var(--border-color);border-radius:var(--radius-md);"><small>${escapeHtml(image.fileName || "Ảnh đã tải lên")}</small></div>`;
    }

    function escapeHtml(value) {
      return window.Storage.escapeHtml(value);
    }
  </script>
</body>
</html>
