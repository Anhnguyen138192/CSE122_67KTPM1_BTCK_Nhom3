<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" crossorigin="anonymous">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biên Tập Điểm Đón An Toàn – CommuteMatch</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div id="app-header"></div>

  <div class="app-shell">
    <div id="app-sidebar"></div>

    <main class="app-main">
      <div class="page-header">
        <div>
          <div class="breadcrumbs">
            <a href="coordinator-pickup-zone-management.html">Trạm đón</a> / <span>Biên tập trạm</span>
          </div>
          <h1 class="page-title" id="editorTitle"><i class='fas fa-plus fa-ui-icon' aria-hidden='true'></i> Thêm Trạm Đón An Toàn Mới</h1>
        </div>
      </div>

      <div class="card" style="max-width: 800px; margin: 0 auto;">
        <div class="card-body" style="padding: 2rem;">
          <form id="zoneEditorForm" onsubmit="savePickupZone(event)">
            <div class="form-group">
              <label class="form-label" for="zName">Tên trạm đón quy ước <span class="required">*</span></label>
              <input type="text" id="zName" class="form-control" placeholder="ví dụ: Điểm đón tại Bến xe Mỹ Đình (cổng chính)" required>
            </div>

            <div class="d-grid grid-cols-2 gap-3 mb-3">
              <div class="form-group mb-0">
                <label class="form-label" for="zArea">Khu vực quản lý <span class="required">*</span></label>
                <select id="zArea" class="form-select" required>
                  <option value="Bến xe Mỹ Đình">Bến xe Mỹ Đình</option>
                  <option value="Bến xe Giáp Bát">Bến xe Giáp Bát</option>
                  <option value="Bến xe Nước Ngầm">Bến xe Nước Ngầm</option>
                  <option value="Bến xe Gia Lâm">Bến xe Gia Lâm</option>
                  <option value="Bến xe Yên Nghĩa">Bến xe Yên Nghĩa</option>
                </select>
              </div>
              <div class="form-group mb-0">
                <label class="form-label" for="zCoordinates">Tọa độ GPS (Vĩ độ, Kinh độ) <span class="required">*</span></label>
                <input type="text" id="zCoordinates" class="form-control" placeholder="ví dụ: 21.0287, 105.7652" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="zAddress">Địa chỉ chi tiết / Điểm mốc nhận diện <span class="required">*</span></label>
              <input type="text" id="zAddress" class="form-control" placeholder="ví dụ: Khu vực đón khách tại cổng chính Bến xe Mỹ Đình..." required>
            </div>

            <div class="d-grid grid-cols-2 gap-3 mb-3">
              <div class="form-group mb-0">
                <label class="form-label" for="zCapacity">Sức chứa người chờ cùng lúc</label>
                <input type="number" id="zCapacity" class="form-control" min="5" max="100" required>
              </div>
              <div class="form-group mb-0">
                <label class="form-label" for="zSafetyScore">Điểm an toàn thẩm định (0 - 10)</label>
                <input type="number" id="zSafetyScore" class="form-control" min="0" max="10" step="0.1" required>
              </div>
            </div>

            <!-- Tiêu chí an toàn Checkboxes -->
            <div class="ai-panel mb-3">
              <div class="font-bold mb-2"><i class='fas fa-shield-alt fa-ui-icon' aria-hidden='true'></i> Tiêu chuẩn hạ tầng an toàn:</div>
              <div class="d-grid grid-cols-2 gap-2" style="font-size: 0.88rem;">
                <label class="d-flex items-center gap-2" style="cursor: pointer;">
                  <input type="checkbox" id="zHasSidewalk"> Có vỉa hè rộng &gt; 3m cho người đi bộ
                </label>
                <label class="d-flex items-center gap-2" style="cursor: pointer;">
                  <input type="checkbox" id="zHasLighting"> Có hệ thống đèn chiếu sáng ban đêm
                </label>
                <label class="d-flex items-center gap-2" style="cursor: pointer;">
                  <input type="checkbox" id="zHasCCTV"> Có camera an ninh quan sát (CCTV)
                </label>
                <label class="d-flex items-center gap-2" style="cursor: pointer;">
                  <input type="checkbox" id="zHasShelter"> Có mái che mưa nắng / Gần bảo vệ
                </label>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="zNotes">Ghi chú lưu ý khi dừng đỗ:</label>
              <textarea id="zNotes" class="form-control" rows="2" placeholder="Ví dụ: Xe dừng sát lề phải tối đa 45 giây, không cản trở lối ra vào trạm xe buýt..."></textarea>
            </div>

            <div class="d-flex justify-between items-center mt-4">
              <a href="coordinator-pickup-zone-management.html" class="btn btn-outline">Hủy bỏ</a>
              <button type="submit" class="btn btn-primary btn-lg"><i class='fas fa-save fa-ui-icon' aria-hidden='true'></i> Lưu Trạm Đón</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script src="../../assets/data/mock-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/modules/toast.js"></script>
  <script src="../../js/modules/modal.js"></script>
  <script src="../../js/modules/auth.js"></script>
  <script src="../../js/modules/ai-engine.js"></script>
  <script src="../../js/routes.js"></script>
  <script src="../../js/main.js"></script>

  <script>
    let editingId = null;

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      editingId = urlParams.get("id");

      if (editingId) {
        document.getElementById("editorTitle").innerText = "<i class='fas fa-edit fa-ui-icon' aria-hidden='true'></i> Cập Nhật Trạm Đón An Toàn";
        const z = window.Storage.getById("pickupZones", editingId);
        if (z) {
          document.getElementById("zName").value = z.name;
          document.getElementById("zArea").value = z.area;
          document.getElementById("zCoordinates").value = z.coordinates;
          document.getElementById("zAddress").value = z.address;
          document.getElementById("zCapacity").value = z.capacity || "";
          document.getElementById("zSafetyScore").value = z.safetyScore !== undefined ? z.safetyScore : "";
          document.getElementById("zHasSidewalk").checked = z.hasSidewalk;
          document.getElementById("zHasLighting").checked = z.hasLighting;
          document.getElementById("zHasCCTV").checked = z.hasCCTV;
          document.getElementById("zHasShelter").checked = z.hasShelter;
          document.getElementById("zNotes").value = z.notes || "";
        }
      }
    });

    function savePickupZone(e) {
      e.preventDefault();

      const zoneData = {
        name: document.getElementById("zName").value.trim(),
        area: document.getElementById("zArea").value,
        coordinates: document.getElementById("zCoordinates").value.trim(),
        address: document.getElementById("zAddress").value.trim(),
        capacity: parseInt(document.getElementById("zCapacity").value, 10),
        safetyScore: parseFloat(document.getElementById("zSafetyScore").value),
        hasSidewalk: document.getElementById("zHasSidewalk").checked,
        hasLighting: document.getElementById("zHasLighting").checked,
        hasCCTV: document.getElementById("zHasCCTV").checked,
        hasShelter: document.getElementById("zHasShelter").checked,
        status: "active",
        notes: document.getElementById("zNotes").value.trim()
      };

      if (editingId) {
        window.Storage.update("pickupZones", editingId, zoneData);
        window.Toast.show("Đã cập nhật trạm đón thành công!", "success");
      } else {
        zoneData.id = "zone_" + Date.now();
        window.Storage.insert("pickupZones", zoneData);
        window.Toast.show("Đã thêm trạm đón mới vào danh mục!", "success");
      }

      setTimeout(() => {
        window.location.href = "coordinator-pickup-zone-management.html";
      }, 700);
    }
  </script>
</body>
</html>
