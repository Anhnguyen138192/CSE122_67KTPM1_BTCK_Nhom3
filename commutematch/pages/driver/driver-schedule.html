<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" crossorigin="anonymous">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Lịch Trình Chuyến Xe – CommuteMatch</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div id="app-header"></div>

  <div class="app-shell">
    <div id="app-sidebar"></div>

    <main class="app-main">
      <div class="page-header">
        <div>
          <div class="breadcrumbs">
            <a href="driver-dashboard.html">Tài xế</a> / <span>Lịch trình</span>
          </div>
          <h1 class="page-title"><i class='fas fa-calendar-alt fa-ui-icon' aria-hidden='true'></i> Quản Lý Lịch Trình Chuyến Xe Của Tôi</h1>
        </div>
        <a href="driver-trip-create.html" class="btn btn-outline btn-sm">Quy trình điều phối</a>
      </div>

      <!-- Tabs Lọc Trạng Thái -->
      <div class="tabs-header">
        <button class="tab-btn active" onclick="switchFilter('scheduled', this)">
          <i class='fas fa-car fa-ui-icon' aria-hidden='true'></i> Sắp Chạy (<span id="countSched">0</span>)
        </button>
        <button class="tab-btn" onclick="switchFilter('completed', this)">
          <i class='fas fa-check-circle fa-ui-icon' aria-hidden='true'></i> Đã Hoàn Thành (<span id="countComp">0</span>)
        </button>
        <button class="tab-btn" onclick="switchFilter('cancelled', this)">
          <i class='fas fa-times-circle fa-ui-icon' aria-hidden='true'></i> Đã Hủy (<span id="countCanc">0</span>)
        </button>
      </div>

      <!-- Schedule Trips List -->
      <div id="scheduleContainer" class="d-flex flex-column gap-3">
        <!-- Loaded dynamically -->
      </div>
    </main>
  </div>

  <!-- Modal Hủy Chuyến Tài Xế -->
  <div class="modal-backdrop" id="driverCancelModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="card-title text-danger">Hủy Chuyến Đi Đã Đăng</h3>
        <button class="btn btn-outline btn-sm" onclick="window.Modal.close('driverCancelModal')">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 0.88rem;">
          Nếu bạn hủy chuyến, hệ thống sẽ tự động gửi thông báo xin lỗi và hoàn trả lại trạng thái cho các hành khách đã đặt vé.
        </p>
        <div class="form-group">
          <label class="form-label">Lý do hủy chuyến:</label>
          <select id="driverCancelReason" class="form-select">
            <option value="Xe gặp sự cố kỹ thuật">Xe gặp sự cố kỹ thuật đột xuất</option>
            <option value="Đột xuất bận việc học/cơ quan">Đột xuất bận việc học / cơ quan</option>
            <option value="Thời tiết mưa bão xấu">Thời tiết xấu không an toàn</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="window.Modal.close('driverCancelModal')">Đóng</button>
        <button type="button" class="btn btn-danger" onclick="confirmDriverCancel()">Xác Nhận Hủy Chuyến</button>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="../../assets/data/mock-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/modules/toast.js"></script>
  <script src="../../js/modules/modal.js"></script>
  <script src="../../js/modules/auth.js"></script>
  <script src="../../js/modules/ai-engine.js"></script>
  <script src="../../js/routes.js"></script>
  <script src="../../js/main.js"></script>

  <script>
    let filterStatus = 'scheduled';
    let cancelTripId = null;

    document.addEventListener("DOMContentLoaded", renderSchedule);

    function renderSchedule() {
      const allTrips = window.Storage.get("trips");
      const user = window.Storage.getCurrentUser();

      // Lọc các chuyến xe của tài xế này
      const myTrips = allTrips.filter(t => t.driverId === user.id);

      const sched = myTrips.filter(t => t.status === 'scheduled');
      const comp = myTrips.filter(t => t.status === 'completed');
      const canc = myTrips.filter(t => t.status === 'cancelled');

      document.getElementById("countSched").innerText = sched.length;
      document.getElementById("countComp").innerText = comp.length;
      document.getElementById("countCanc").innerText = canc.length;

      let list = [];
      if (filterStatus === 'scheduled') list = sched;
      else if (filterStatus === 'completed') list = comp;
      else if (filterStatus === 'cancelled') list = canc;

      const container = document.getElementById("scheduleContainer");

      if (list.length === 0) {
        container.innerHTML = `
          <div class="card">
            <div class="empty-state">
              <div class="empty-icon"><i class='fas fa-calendar-alt fa-ui-icon' aria-hidden='true'></i></div>
              <div class="empty-title">Không có chuyến xe nào trong mục này</div>
              <div class="empty-desc">Điều phối viên chưa phân công chuyến nào ở trạng thái này. Tuyến và điểm đón do điều phối viên thiết lập.</div>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(t => `
        <div class="card" style="border-left: 4px solid ${
          t.status === 'scheduled' ? 'var(--primary)' :
          t.status === 'completed' ? 'var(--success)' : 'var(--danger)'
        };">
          <div class="card-body">
            <div class="d-flex justify-between items-start flex-wrap gap-2 mb-2">
              <div>
                <span class="badge ${
                  t.status === 'scheduled' ? 'badge-primary' :
                  t.status === 'completed' ? 'badge-success' : 'badge-danger'
                } mb-1">
                  ${t.status === 'scheduled' ? 'Sắp khởi hành' : t.status === 'completed' ? 'Đã hoàn thành' : 'Đã hủy'}
                </span>
                <h3 style="font-size: 1.15rem; margin: 0.2rem 0;">
                  ${window.Storage.escapeHtml(t.origin)} → ${window.Storage.escapeHtml(t.destination)}
                </h3>
                <div style="font-size: 0.85rem; color: var(--text-muted);">
                  <i class='fas fa-calendar-alt fa-ui-icon' aria-hidden='true'></i> Ngày đi: <strong>${window.Storage.escapeHtml(t.departureDate)}</strong> • Giờ xuất phát: <strong style="color: var(--primary);">${window.Storage.escapeHtml(t.departureTime)}</strong>
                  • Dự kiến đến: <strong>${window.Storage.escapeHtml(t.estimatedArrivalTime || "Chưa cập nhật")}</strong>
                  • Quãng đường: <strong>${Number(t.estimatedDistanceKm) > 0 ? `${Number(t.estimatedDistanceKm).toLocaleString("vi-VN")} km` : "Chưa cập nhật"}</strong>
                </div>
              </div>

              <div class="text-right">
                <div class="font-bold" style="font-size: 1.25rem; color: var(--text-main);">
                  ${Number(t.costSharing || 0).toLocaleString('vi-VN')} đ
                </div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Chia sẻ / người</div>
              </div>
            </div>

            <div style="background-color: var(--bg-muted); padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.88rem; margin-bottom: 1rem;">
              <div class="d-flex justify-between mb-1">
                <span><i class='fas fa-map-signs fa-ui-icon' aria-hidden='true'></i> Điểm đón: <strong>${window.Storage.escapeHtml(t.pickupZoneName || 'Chưa có trạm đón')}</strong></span>
                <span>Chỗ trống: <strong>${t.availableSeats} / ${t.totalSeats} ghế</strong></span>
              </div>
              <div class="d-flex justify-between text-muted" style="font-size: 0.8rem;">
                <span>Phương tiện: ${window.Storage.escapeHtml(t.vehicleInfo)}</span>
                <span>Ghi chú: ${window.Storage.escapeHtml(t.notes || 'Không có')}</span>
              </div>
            </div>

            <div class="d-flex justify-end gap-2">
              ${t.status === 'scheduled' ? `
                <a href="driver-trip-execution.html?id=${encodeURIComponent(t.id)}" class="btn btn-secondary btn-sm"><i class='fas fa-traffic-light fa-ui-icon' aria-hidden='true'></i> Điều Hành Chuyến Đi</a>
                <a href="driver-trip-detail.html?id=${encodeURIComponent(t.id)}" class="btn btn-outline btn-sm">Chi Tiết & Khách</a>
                <button class="btn btn-outline btn-sm text-danger" onclick="promptCancelTrip('${t.id}')">Hủy Chuyến</button>
              ` : `
                <a href="driver-trip-detail.html?id=${encodeURIComponent(t.id)}" class="btn btn-outline btn-sm">Xem Lại Lịch Sử</a>
              `}
            </div>
          </div>
        </div>
      `).join('');
    }

    function switchFilter(st, btn) {
      filterStatus = st;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderSchedule();
    }

    function promptCancelTrip(tripId) {
      cancelTripId = tripId;
      window.Modal.open("driverCancelModal");
    }

    function confirmDriverCancel() {
      if (!cancelTripId) return;
      const reason = document.getElementById("driverCancelReason").value;
      const user = window.Storage.getCurrentUser();
      const trip = window.Storage.getById("trips", cancelTripId);
      if (!trip || trip.driverId !== user.id || trip.status !== "scheduled") {
        window.Toast.show("Chỉ tài xế được phân công mới có thể hủy chuyến đang lên lịch.", "error");
        return;
      }

      window.Storage.update("trips", cancelTripId, {
        status: "cancelled",
        cancelReason: reason
      });
      window.Storage.get("joinRequests")
        .filter((request) => request.tripId === trip.id && ["pending", "accepted"].includes(request.status))
        .forEach((request) => {
          window.Storage.update("joinRequests", request.id, { status: "cancelled", cancelReason: reason });
          window.Storage.insert("notifications", {
            userId: request.riderId,
            title: "Chuyến được điều phối đã bị hủy",
            message: `Chuyến ${trip.origin} → ${trip.destination} đã bị hủy. Lý do: ${reason}.`,
            time: "Vừa xong",
            type: "trip_cancelled",
            unread: true,
            link: "../rider/rider-my-trips.html"
          });
        });

      window.Modal.close("driverCancelModal");
      window.Toast.show("Đã hủy chuyến đi thành công.", "info");
      renderSchedule();
    }
  </script>
</body>
</html>
