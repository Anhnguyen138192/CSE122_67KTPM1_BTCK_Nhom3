<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" crossorigin="anonymous">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Phương Tiện Cá Nhân – CommuteMatch</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div id="app-header"></div>

  <div class="app-shell">
    <div id="app-sidebar"></div>

    <main class="app-main">
      <div class="page-header">
        <div>
          <div class="breadcrumbs">
            <a href="profile-overview.html">Hồ sơ</a> / <span>Phương tiện</span>
          </div>
          <h1 class="page-title"><i class='fas fa-car-side fa-ui-icon' aria-hidden='true'></i> Phương Tiện Chia Sẻ (Ô Tô Nhiều Chỗ)</h1>
          <p class="text-muted">Ô tô mới khai báo sẽ ở trạng thái chờ; điều phối viên cần kiểm định đạt trước khi xe được phân công chuyến.</p>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openAddVehicleModal()">
          <i class='fas fa-plus fa-ui-icon' aria-hidden='true'></i> Thêm Phương Tiện Mới
        </button>
      </div>

      <div class="card mb-4">
        <div class="card-header">
          <h3 class="card-title">Danh Sách Xe Đã Đăng Ký</h3>
        </div>
        <div class="card-body">
          <div id="vehiclesList" class="d-grid grid-cols-2 gap-3">
            <!-- Render vehicles dynamically from Storage -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Thêm Phương Tiện -->
  <div class="modal-backdrop" id="vehicleModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="card-title" id="modalTitle">Thêm Xe Chia Sẻ Mới</h3>
        <button class="btn btn-outline btn-sm" onclick="window.Modal.close('vehicleModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="vehicleForm" onsubmit="handleSaveVehicle(event)">
          <div class="form-group">
            <label class="form-label">Loại phương tiện <span class="required">*</span></label>
            <select id="vType" class="form-select" required onchange="syncVehicleSeatCount()">
              <option value="SUV/MPV 7 chỗ">SUV/MPV 7 chỗ (Xpander, Innova, Carnival)</option>
              <option value="Minibus 16 chỗ">Minibus 16 chỗ (Transit, Solati)</option>
              <option value="Minibus 29 chỗ">Minibus 29 chỗ</option>
              <option value="Xe khách 45 chỗ">Xe khách 45 chỗ</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Tên đời xe & Hãng <span class="required">*</span></label>
            <input type="text" id="vModel" class="form-control" placeholder="Ví dụ: Ford Transit 2024" required>
          </div>

          <div class="d-grid grid-cols-2 gap-2">
            <div class="form-group">
              <label class="form-label">Biển kiểm soát <span class="required">*</span></label>
              <input type="text" id="vPlate" class="form-control" placeholder="Ví dụ: 51B-123.45" required>
            </div>
            <div class="form-group">
              <label class="form-label">Tổng số ghế trên xe (kể cả tài xế) <span class="required">*</span></label>
              <select id="vSeats" class="form-select" required>
                <option value="7">7 chỗ · tối đa 6 hành khách</option>
                <option value="16">16 chỗ · tối đa 15 hành khách</option>
                <option value="29">29 chỗ · tối đa 28 hành khách</option>
                <option value="45">45 chỗ · tối đa 44 hành khách</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Màu sắc xe</label>
            <input type="text" id="vColor" class="form-control" placeholder="Trắng, bạc, đen...">
          </div>

          <div class="form-group">
            <label class="form-label" for="vPhoto">Ảnh ô tô để điều phối viên kiểm định <span class="required">*</span></label>
            <input type="file" id="vPhoto" class="form-control" accept="image/*" required>
            <small class="text-muted">Chọn ảnh rõ phần thân xe và biển số (tối đa 5 MB).</small>
          </div>

          <div class="form-group">
            <label class="d-flex items-center gap-1" style="font-size: 0.85rem; cursor: pointer;">
              <input type="checkbox" id="vInsurance" checked> Xe có bảo hiểm TNDS bắt buộc còn hiệu lực
            </label>
          </div>

          <div class="modal-footer" style="padding-right: 0; padding-bottom: 0;">
            <button type="button" class="btn btn-outline" onclick="window.Modal.close('vehicleModal')">Đóng</button>
            <button type="submit" class="btn btn-primary">Lưu Phương Tiện</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="../../assets/data/mock-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/modules/toast.js"></script>
  <script src="../../js/modules/modal.js"></script>
  <script src="../../js/modules/auth.js"></script>
  <script src="../../js/modules/ai-engine.js"></script>
  <script src="../../js/routes.js"></script>
  <script src="../../js/main.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", renderVehicles);

    function syncVehicleSeatCount() {
      const seatCountByType = {
        "SUV/MPV 7 chỗ": 7,
        "Minibus 16 chỗ": 16,
        "Minibus 29 chỗ": 29,
        "Xe khách 45 chỗ": 45
      };
      document.getElementById("vSeats").value = String(seatCountByType[document.getElementById("vType").value]);
    }

    function renderVehicles() {
      const u = window.Storage.getCurrentUser();
      const container = document.getElementById("vehiclesList");

      const vehicles = u.vehiclesList || (u.vehicle ? [u.vehicle] : []);

      if (vehicles.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: span 2;">
            <div class="empty-icon"><i class='fas fa-car-side fa-ui-icon' aria-hidden='true'></i></div>
            <div class="empty-title">Chưa có phương tiện nào</div>
            <div class="empty-desc">Khai báo ô tô từ 7 chỗ trở lên để điều phối viên có thể phân công chuyến ghép nhiều hành khách. Sức chứa hành khách bằng tổng số ghế trừ ghế tài xế.</div>
            <button class="btn btn-primary" onclick="openAddVehicleModal()"><i class='fas fa-plus fa-ui-icon' aria-hidden='true'></i> Thêm phương tiện đầu tiên</button>
          </div>
        `;
        return;
      }

      container.innerHTML = vehicles.map((v, i) => `
        <div class="card" style="border-left: 4px solid var(--primary);">
          <div class="card-body">
            <div class="d-flex justify-between items-start mb-2">
              <div>
                <span class="badge ${v.inspectionStatus === "approved" ? "badge-success" : v.inspectionStatus === "rejected" ? "badge-danger" : "badge-warning"} mb-1">
                  ${v.inspectionStatus === "approved" ? "Đã được điều phối viên kiểm định" : v.inspectionStatus === "rejected" ? "Kiểm định chưa đạt" : "Chờ điều phối viên kiểm định"}
                </span>
                <h4 style="font-size: 1.1rem;">${window.Storage.escapeHtml(v.type || v.model || 'Ô tô')}</h4>
                <div style="font-size: 0.85rem; color: var(--text-muted);">${v.color || 'Màu tiêu chuẩn'}</div>
              </div>
              <span style="font-size: 1.8rem;"><i class='fas fa-car-side fa-ui-icon' aria-hidden='true'></i></span>
            </div>
            ${v.vehiclePhoto && v.vehiclePhoto.dataUrl
              ? `<img src="${window.Storage.escapeHtml(v.vehiclePhoto.dataUrl)}" alt="Ảnh ${window.Storage.escapeHtml(v.type || "ô tô")}" style="width:100%;max-height:220px;object-fit:contain;margin-bottom:1rem;border-radius:var(--radius-md);">`
              : ""}

            <div style="background-color: var(--bg-muted); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.88rem; margin-bottom: 1rem;">
              <div class="d-flex justify-between mb-1">
                <span class="text-muted">Biển số:</span>
                <strong class="font-bold">${window.Storage.escapeHtml(v.plate)}</strong>
              </div>
              <div class="d-flex justify-between">
                <span class="text-muted">Sức chứa hành khách:</span>
                <span>${Math.max(0, Number(v.seatsTotal || v.seats || 0) - 1)} ghế</span>
              </div>
            </div>

            <div class="d-flex justify-end gap-1">
              <button class="btn btn-danger btn-sm" onclick="deleteVehicle(${i})">Xóa xe</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openAddVehicleModal() {
      document.getElementById("vehicleForm").reset();
      syncVehicleSeatCount();
      window.Modal.open("vehicleModal");
    }

    async function handleSaveVehicle(e) {
      e.preventDefault();
      const u = window.Storage.getCurrentUser();
      const type = document.getElementById("vType").value;
      const model = document.getElementById("vModel").value.trim();
      const plate = document.getElementById("vPlate").value.trim();
      const seats = parseInt(document.getElementById("vSeats").value, 10);
      const color = document.getElementById("vColor").value.trim();
      const expectedSeats = {
        "SUV/MPV 7 chỗ": 7,
        "Minibus 16 chỗ": 16,
        "Minibus 29 chỗ": 29,
        "Xe khách 45 chỗ": 45
      }[type];
      if (seats !== expectedSeats) {
        window.Toast.show("Số ghế phải khớp với dòng ô tô đã chọn.", "error");
        return;
      }
      let vehiclePhoto;
      try {
        vehiclePhoto = await readVehiclePhoto(document.getElementById("vPhoto").files[0]);
      } catch (error) {
        window.Toast.show(error.message, "error");
        return;
      }

      const newV = {
        type: `${type} (${model})`,
        vehicleType: "car",
        plate: plate,
        seatsTotal: seats,
        seats: seats,
        color: color || "Tiêu chuẩn",
        vehiclePhoto,
        inspectionStatus: "pending"
      };

      const currentList = u.vehiclesList || (u.vehicle ? [u.vehicle] : []);
      const nextList = [...currentList, newV];

      window.Storage.update("users", u.id, {
        vehicle: newV,
        vehiclesList: nextList
      });

      window.Modal.close("vehicleModal");
      window.Toast.show("Đã gửi phương tiện để điều phối viên kiểm định.", "success");
      renderVehicles();
    }

    function readVehiclePhoto(file) {
      if (!file) return Promise.reject(new Error("Vui lòng tải ảnh ô tô để kiểm định."));
      if (!file.type.startsWith("image/")) {
        return Promise.reject(new Error("Chỉ chấp nhận tệp ảnh ô tô."));
      }
      if (file.size > 5 * 1024 * 1024) {
        return Promise.reject(new Error("Ảnh ô tô phải nhỏ hơn 5 MB."));
      }
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Không thể đọc ảnh ô tô."));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error("Tệp ảnh ô tô không hợp lệ."));
          image.onload = () => {
            const scale = Math.min(1, 1200 / Math.max(image.width, image.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(image.width * scale);
            canvas.height = Math.round(image.height * scale);
            const context = canvas.getContext("2d");
            if (!context) {
              reject(new Error("Trình duyệt không thể xử lý ảnh ô tô."));
              return;
            }
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            canvas.toBlob((blob) => {
              if (!blob) {
                reject(new Error("Không thể nén ảnh ô tô."));
                return;
              }
              const compressedReader = new FileReader();
              compressedReader.onerror = () => reject(new Error("Không thể lưu ảnh ô tô đã xử lý."));
              compressedReader.onload = () => resolve({
                dataUrl: compressedReader.result,
                fileName: file.name
              });
              compressedReader.readAsDataURL(blob);
            }, "image/jpeg", 0.8);
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function deleteVehicle(index) {
      if (!confirm("Bạn có chắc chắn muốn xóa phương tiện này?")) return;
      const u = window.Storage.getCurrentUser();
      const currentList = u.vehiclesList || (u.vehicle ? [u.vehicle] : []);
      currentList.splice(index, 1);

      window.Storage.update("users", u.id, {
        vehiclesList: currentList,
        vehicle: currentList[0] || null
      });

      window.Toast.show("Đã xóa phương tiện.", "info");
      renderVehicles();
    }
  </script>
</body>
</html>
