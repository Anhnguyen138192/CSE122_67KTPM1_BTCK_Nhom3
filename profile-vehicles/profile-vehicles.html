<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Phương Tiện Cá Nhân - CommuteMatch</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/profile-vehicles.css">
</head>

<body>
  <div id="app-header"></div>

  <div class="app-shell">
    <div id="app-sidebar"></div>

    <main class="app-main">
      <div class="page-header">
        <div>
          <div class="breadcrumbs">
            <a>Hồ sơ</a> / <span>Phương tiện</span>
          </div>
          <h1 class="page-title"><i class="fa-solid fa-car-side" aria-hidden="true"></i> Phương Tiện Cá Nhân (Ô tô điện
            & Ô tô xăng)</h1>
        </div>
        <button id="addVehicleButton" class="btn btn-primary btn-sm" type="button">
          <i class="fa-solid fa-plus" aria-hidden="true"></i> Thêm Phương Tiện Mới
        </button>
      </div>

      <div class="card mb-4">
        <div class="card-header">
          <h3 class="card-title">Danh Sách Xe Đã Đăng Ký</h3>
        </div>
        <div class="card-body">
          <div id="vehiclesList" class="d-grid grid-cols-2 gap-3">
            <!-- Render vehicles dynamically from Storage -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Thêm Phương Tiện -->
  <div class="modal-backdrop" id="vehicleModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="card-title" id="modalTitle">Thêm Xe Chia Sẻ Mới</h3>
        <button class="btn btn-outline btn-sm js-close-vehicle-modal" type="button" aria-label="Đóng"
          data-close-modal="vehicleModal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="vehicleForm">
          <div class="form-group">
            <label class="form-label" for="vType">Loại phương tiện <span class="required">*</span></label>
            <select id="vType" class="form-select" required>
              <option value="Ô tô điện">Ô tô điện</option>
              <option value="Ô tô xăng">Ô tô xăng</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="vModel">Tên đời xe & Hãng <span class="required">*</span></label>
            <input type="text" id="vModel" class="form-control" placeholder="ví dụ: VinFast VF 8" required>
          </div>

          <div class="d-grid grid-cols-2 gap-2">
            <div class="form-group">
              <label class="form-label" for="vPlate">Biển kiểm soát <span class="required">*</span></label>
              <input type="text" id="vPlate" class="form-control" placeholder="59-X3 888.99" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="vSeats">Số chỗ có thể chở <span class="required">*</span></label>
              <input type="number" id="vSeats" class="form-control" value="4" min="1" max="6" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="vColor">Màu sắc xe</label>
            <input type="text" id="vColor" class="form-control" placeholder="Đen nhám, Trắng, Đỏ...">
          </div>

          <div class="form-group">
            <label class="vehicle-insurance-label">
              <input type="checkbox" id="vInsurance" checked> Xe có bảo hiểm TNDS bắt buộc còn hiệu lực
            </label>
          </div>

          <div class="modal-footer vehicle-modal-footer">
            <button type="button" class="btn btn-outline js-close-vehicle-modal"
              data-close-modal="vehicleModal">Đóng</button>
            <button type="submit" class="btn btn-primary">Lưu Phương Tiện</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="js/storage.js"></script>
  <script src="js/modules/toast.js"></script>
  <script src="js/modules/modal.js"></script>
  <script src="js/modules/auth.js"></script>

  <script src="js/profile-vehicles.js"></script>
</body>

</html>
