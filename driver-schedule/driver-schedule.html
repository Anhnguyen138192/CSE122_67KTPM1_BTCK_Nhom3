<!DOCTYPE html>
<html lang="vi">

<head>
  <base href="./">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Lịch Trình Chuyến Xe – CommuteMatch</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
  <main class="app-main">
    <div class="page-header">
      <div>
        <div class="breadcrumbs">
          <a href="driver/driver-dashboard.html">Tài xế</a> / <span>Lịch trình</span>
        </div>
        <h1 class="page-title"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i> Quản Lý Lịch Trình Chuyến Xe
          Của Tôi</h1>
      </div>
      <div class="d-flex gap-2">
        <a href="driver/driver-trip-create.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"
            aria-hidden="true"></i> Tạo Chuyến Mới</a>
      </div>
    </div>

    <!-- Tabs Lọc Trạng Thái -->
    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchFilter('scheduled', this)">
        <i class="fa-solid fa-car" aria-hidden="true"></i> Sắp Chạy (<span id="countSched">0</span>)
      </button>
      <button class="tab-btn" onclick="switchFilter('completed', this)">
        <i class="fa-solid fa-circle-check" aria-hidden="true"></i> Đã Hoàn Thành (<span id="countComp">0</span>)
      </button>
      <button class="tab-btn" onclick="switchFilter('cancelled', this)">
        <i class="fa-solid fa-circle-xmark" aria-hidden="true"></i> Đã Hủy (<span id="countCanc">0</span>)
      </button>
    </div>

    <!-- Schedule Trips List -->
    <div id="scheduleContainer" class="d-flex flex-column gap-3">
      <!-- Loaded dynamically -->
    </div>
  </main>

  <!-- Modal Hủy Chuyến Tài Xế -->
  <div class="modal-backdrop" id="driverCancelModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="card-title text-danger">Hủy Chuyến Đi Đã Đăng</h3>
        <button class="btn btn-outline btn-sm" onclick="window.Modal.close('driverCancelModal')">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 0.88rem;">
          Nếu bạn hủy chuyến, hệ thống sẽ tự động gửi thông báo xin lỗi và hoàn trả lại trạng thái cho các hành khách đã
          đặt vé.
        </p>
        <div class="form-group">
          <label class="form-label">Lý do hủy chuyến:</label>
          <select id="driverCancelReason" class="form-select">
            <option value="Xe gặp sự cố kỹ thuật">Xe gặp sự cố kỹ thuật đột xuất</option>
            <option value="Đột xuất bận việc học/cơ quan">Đột xuất bận việc học / cơ quan</option>
            <option value="Thời tiết mưa bão xấu">Thời tiết xấu không an toàn</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="window.Modal.close('driverCancelModal')">Đóng</button>
        <button type="button" class="btn btn-danger" onclick="confirmDriverCancel()">Xác Nhận Hủy Chuyến</button>
      </div>
    </div>
  </div>

  <script src="js/data/mock-data.js"></script>

  <script src="js/storage.js"></script>
  <script src="js/modules/toast.js"></script>
  <script src="js/modules/modal.js"></script>
  <script src="js/modules/auth.js"></script>
  <script src="js/modules/ai-engine.js"></script>
  <script src="js/main.js"></script>
  <script src="js/modules/driver-trip-utils.js"></script>
  <script src="js/modules/driver-api.js"></script>

  <script src="js/driver-schedule.js"></script>
</body>

</html>
